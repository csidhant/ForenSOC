version: '3.8'

# ==============================================================================
# ForenSOC — Full-Stack Docker Compose
# Usage:
#   Development : docker compose up
#   Production  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: forensoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forensoc
      POSTGRES_USER: forensoc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensoc_changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensoc_user -d forensoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensoc-network

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: forensoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensoc-network

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forensoc-backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - python -c 'from app.main import init_database; init_database()' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: postgresql://forensoc_user:${POSTGRES_PASSWORD:-forensoc_changeme}@postgres:5432/forensoc
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      REDIS_URL: redis://redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@forensoc.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env — copy .env.example to .env}
      ALLOWED_ORIGINS_STR: ${ALLOWED_ORIGINS_STR:-http://localhost,http://localhost:3000,http://localhost:80,http://docs.forensoc.local,https://docs.forensoc.local}
      UPLOAD_DIR: /app/uploads
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ingest_drop:/app/ingest_drop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forensoc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: forensoc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forensoc-network

  # ── Nginx Reverse Proxy (routes /api + /socket.io to backend, / to frontend)
  nginx:
    image: nginx:1.25-alpine
    container_name: forensoc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - forensoc-network

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
  ingest_drop:

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  forensoc-network:
    driver: bridge
