version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forensoc-postgres
    environment:
      POSTGRES_DB: forensoc
      POSTGRES_USER: forensoc_user
      POSTGRES_PASSWORD: forensoc_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensoc_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensoc-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: forensoc-backend
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://forensoc_user:forensoc_password_change_me@postgres:5432/forensoc
      SECRET_KEY: your-super-secret-key-change-in-production
      DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - forensoc-network

  celery-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: forensoc-celery
    working_dir: /app
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://forensoc_user:forensoc_password_change_me@postgres:5432/forensoc
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - forensoc-network

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: forensoc-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - forensoc-network

volumes:
  postgres_data:

networks:
  forensoc-network:
    driver: bridge
