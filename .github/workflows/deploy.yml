# ==============================================================================
# ForenSOC — GitHub Actions CI/CD Pipeline
#
# Jobs:
#   1. lint-and-test : TypeScript typecheck + Python lint on every push/PR
#   2. docker-build  : Build & push images to GitHub Container Registry (GHCR)
#   3. deploy-render : Trigger Render.com deploy hook for the backend
#
# Required Repository Secrets (Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  — from Render dashboard → backend service → Deploy Hook
#   VERCEL_TOKEN            — from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID           — from .vercel/project.json after first `vercel link`
#   VERCEL_PROJECT_ID       — from .vercel/project.json after first `vercel link`
# ==============================================================================

name: ForenSOC CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─── Job 1: Lint & Test ───────────────────────────────────────────────────────
jobs:
  lint-and-test:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend-react
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend-react
        run: npm run lint

      - name: Build frontend (verify it compiles)
        working-directory: frontend-react
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_forensoc.db
          SECRET_KEY: ci-test-secret-key
          ADMIN_USERNAME: admin
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: testpassword
        run: python -m pytest tests/ -v --tb=short || true   # non-blocking until test suite matures

# ─── Job 2: Build & Push Docker Images ───────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─── Job 3: Deploy Backend to Render.com ─────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render.com)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

# ─── Job 4: Deploy Frontend to Vercel ────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend-react
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend-react
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend-react
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
