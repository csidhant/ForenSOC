worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied    any;
    gzip_vary       on;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream forensoc_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Max upload size (evidence files can be large)
        client_max_body_size 512M;

        # ── API Proxy ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://forensoc_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket / Socket.IO ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://forensoc_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
        }

        # ── Health Check (direct to backend) ──────────────────────────────────
        location /health {
            proxy_pass http://forensoc_backend/health;
        }

        # ── React SPA ─────────────────────────────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # Required for React Router — always serve index.html for unknown paths
            try_files $uri $uri/ /index.html;
        }

        # ── Static Asset Caching ──────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }
    }
}
