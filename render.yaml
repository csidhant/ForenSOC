# render.yaml — Render.com Blueprint
# Deploys the ForenSOC backend as a Web Service + PostgreSQL database
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forensoc-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forensoc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random string
      - key: DEBUG
        value: "false"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@forensoc.local
      - key: ADMIN_PASSWORD
        value: ForenSOC@2024!        # Change this after first login!
      - key: ALLOWED_ORIGINS_STR
        value: ""                    # Fill in your Vercel URL after deploying frontend
                                     # e.g. https://forensoc.vercel.app
      - key: UPLOAD_DIR
        value: /opt/render/project/uploads
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: forensoc-db
    databaseName: forensoc
    user: forensoc_user
    plan: free
